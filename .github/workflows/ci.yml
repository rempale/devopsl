name: CI

on:
  push:
    branches: [main]
    paths: ['cicd/**', '.github/workflows/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Run unit tests
        working-directory: cicd
        run: mvn test

  build:
    needs: test

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Build JAR
        working-directory: cicd
        run: mvn clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: my-built-jar
          path: cicd/target/*.jar